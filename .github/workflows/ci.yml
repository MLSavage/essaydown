# ci.yml (task 0.2) — pnpm lint, pnpm test, cargo test on the three OSes; JDK, poppler-utils,
# epubcheck and html-validate installed now (pinned from docker/versions.env, unused until later
# phases) so this one workflow never needs re-touching for those tools. Triggers on push to
# ci/** refs only: scripts/gate.sh pushes ci/<task-id>/a<n> at the integrated SHA (CLAUDE.md,
# docs/RUNNER-SPEC.md §3) — there is no push-to-main or pull_request trigger.
name: CI

on:
  push:
    branches:
      - 'ci/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned tool versions (docker/versions.env)
        shell: bash
        run: grep -E '^[A-Z_]+=' docker/versions.env >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        shell: bash
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Linux runners need the Tauri build deps and poppler-utils that docker/Dockerfile already
      # has for the container; macOS and Windows GitHub runners ship the toolchains Tauri needs
      # (Xcode CLT, MSVC + WebView2) so only poppler-utils is installed there.
      - name: Install Tauri Linux build dependencies + poppler-utils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev poppler-utils

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install poppler-utils (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler

      - name: Install poppler-utils (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install poppler --yes --no-progress

      - name: Install epubcheck ${{ env.EPUBCHECK_VERSION }}
        shell: bash
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "${RUNNER_TEMP}/epubcheck.zip" -d "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          printf '#!/bin/sh\nexec java -jar "%s/epubcheck-%s/epubcheck.jar" "$@"\n' \
            "${RUNNER_TEMP}" "${EPUBCHECK_VERSION}" > "${RUNNER_TEMP}/bin/epubcheck"
          chmod 0755 "${RUNNER_TEMP}/bin/epubcheck"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Install html-validate ${{ env.HTML_VALIDATE_VERSION }}
        shell: bash
        run: npm install -g "html-validate@${HTML_VALIDATE_VERSION}"

      - name: Print tool versions
        shell: bash
        run: |
          epubcheck --version
          npx html-validate --version
          pdfimages -v

      - name: Lint
        shell: bash
        run: pnpm lint 2>&1 | tee lint.log

      - name: Test
        shell: bash
        run: pnpm test 2>&1 | tee test.log

      - name: Cargo test
        shell: bash
        run: cargo test 2>&1 | tee cargo-test.log

      # The browser cache is per runner, never assume it is present. --with-deps installs the
      # OS package dependencies Chromium needs on Linux; macOS and Windows runners already carry
      # them, and --with-deps there `sudo`s in a way that fails outside apt-based images.
      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm --filter @essaydown/e2e-web exec playwright install --with-deps chromium

      - name: Install Playwright browser (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm --filter @essaydown/e2e-web exec playwright install chromium

      - name: Playwright (e2e/web)
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm --filter @essaydown/e2e-web exec playwright test --reporter=list,html

      - name: playwright-report-${{ matrix.os }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/web/playwright-report
          if-no-files-found: ignore

      - name: Runner conformance suite (RUNNER-SPEC §12, ubuntu leg only)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ralph/test/run.sh 2>&1 | tee ralph-test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            lint.log
            test.log
            cargo-test.log
            ralph-test.log
          if-no-files-found: ignore

  # e2e-shell (task 2.1) — the Tauri shell itself, via WebdriverIO + @wdio/tauri-service
  # (e2e/shell). Ubuntu and Windows drive the app through the cargo-installed tauri-driver
  # against WebKitWebDriver / msedgedriver (`driverProvider: 'external'`, e2e/shell/wdio.conf.ts);
  # macOS has no external WebDriver for WKWebView, so it runs the embedded provider instead
  # (tauri-plugin-wdio-webdriver, registered under #[cfg(debug_assertions)] in
  # apps/desktop/src-tauri/src/lib.rs, PRD §4) and is continue-on-error until Phase 6 (PRD §8 2.1).
  e2e-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned tool versions (docker/versions.env)
        shell: bash
        run: grep -E '^[A-Z_]+=' docker/versions.env >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        shell: bash
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Same Tauri Linux build deps as the `test` job, plus the two the shell e2e driver route
      # needs (docker/Dockerfile already carries both for the container): webkit2gtk-driver is
      # WebKitWebDriver itself, xauth is what `xvfb-run` needs to create its per-session cookie.
      - name: Install Tauri Linux build dependencies + webkit2gtk-driver + xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            webkit2gtk-driver xvfb xauth

      # macOS's embedded provider needs no external driver; Windows' msedgedriver is auto-managed
      # by @wdio/tauri-service (autoDownloadEdgeDriver, e2e/shell/wdio.conf.ts).
      - name: Install tauri-driver ${{ env.TAURI_DRIVER_VERSION }} (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: cargo install tauri-driver --version "${TAURI_DRIVER_VERSION}" --locked

      - name: Build the frontend bundle
        shell: bash
        run: pnpm --filter @essaydown/desktop build

      # `custom-protocol` embeds the built frontend into the binary (tauri.conf.json's
      # `frontendDist`) instead of loading `build.devUrl`, so the app is self-contained for
      # tauri-driver / the embedded provider; a plain debug build without it always loads the Vite
      # dev server regardless of profile (verified in the container: Cargo's `dev`/`custom_protocol`
      # cfg alias is set by this feature name alone, not by `--release`). debug_assertions stays
      # on, so tauri-plugin-wdio-webdriver's registration in lib.rs is still compiled in.
      - name: Build the Tauri app
        shell: bash
        run: cargo build -p desktop --features custom-protocol

      - name: WebdriverIO (e2e/shell, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a pnpm --filter @essaydown/e2e-shell test 2>&1 | tee e2e-shell.log

      - name: WebdriverIO (e2e/shell, macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm --filter @essaydown/e2e-shell test 2>&1 | tee e2e-shell.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-${{ matrix.os }}
          path: e2e-shell.log
          if-no-files-found: ignore

  merge-logs:
    needs: [test, e2e-shell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Merge per-OS logs into one test-logs artifact
        if: always()
        uses: actions/upload-artifact/merge@v4
        with:
          name: test-logs
          pattern: test-logs-*
          separate-directories: true
          delete-merged: true

      - name: playwright-report
        if: always()
        uses: actions/upload-artifact/merge@v4
        with:
          name: playwright-report
          pattern: playwright-report-*
          separate-directories: true
          delete-merged: true

      - name: e2e-shell
        if: always()
        uses: actions/upload-artifact/merge@v4
        with:
          name: e2e-shell
          pattern: e2e-shell-*
          separate-directories: true
          delete-merged: true
