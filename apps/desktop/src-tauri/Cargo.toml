[package]
name = "desktop"
version = "0.1.0"
description = "Essay Down"
authors = ["Savage Systems"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Off by default so `pnpm tauri dev` keeps loading the Vite dev server (`build.devUrl`,
# tauri.conf.json) unchanged; the shell e2e harness (e2e/shell) builds with this feature so the
# binary embeds `build.frontendDist` instead and needs no dev server running (Tauri's own
# `dev`/`custom_protocol` cfg alias, set by `tauri`'s build.rs from this exact feature name).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# `protocol-asset` is the asset: protocol scope tauri-plugin-persisted-scope's own `protocol-asset`
# feature needs (PRD §6.4 images: `assetProtocol.enable = true`).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# debug/test builds only (PRD §4): the embedded WebDriver server the WDIO Tauri plugin's macOS and
# Windows provider needs (Windows moved here at 2.1.g1 — actions/runner-images #14738 makes the
# tauri-driver -> msedgedriver route unable to create a session at all); ubuntu alone drives the
# app through the cargo-installed tauri-driver instead.
# Cargo's `[target.'cfg(...)'.dependencies]` only understands target-arch/os selectors,
# not `debug_assertions` (an always-on dependency with a warning, not a conditional one — verified
# against a bare `cargo build`), so the crate is linked unconditionally and `lib.rs` gates its one
# `.plugin(...)` registration call behind `#[cfg(debug_assertions)]` instead, matching
# tauri-plugin-wdio-webdriver's own "Production Considerations" doc.
tauri-plugin-wdio-webdriver = "1"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
# The file tree sidebar's "Open Folder" native folder picker (PRD §4 Rust crates row).
tauri-plugin-dialog = "2"
# `export`'s pandoc/typst sidecars (PRD §4 Rust crates row, §6.4 `export`; task 4.2): the
# `shell:allow-spawn` capability scope below is the only thing that can invoke either sidecar.
tauri-plugin-shell = "2"
# `delete_to_trash`'s real `TrashBackend` impl (PRD §4, §6.4); tests inject a recording fake instead.
trash = "5"
# `watch_folder`'s filesystem watcher (PRD §4 Rust crates row, §6.4: notify → event `fs:changed`).
notify = "8"
# The coach credential's OS-keyring backend (PRD §4 Secrets row, §6.4 `set_coach_key`/
# `has_coach_key`/`clear_coach_key`); default features cover macOS Keychain, Windows Credential
# Manager and Linux secret-service. `cargo test` uses an in-memory fake instead (`coach_key.rs`).
keyring = "4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

